<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Tip calculator app</title>
    <!-- <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style> -->
  </head>
  <body>
    <div class="container">
      <!-- <section> -->
      <div class="bill-page">
        <div class="bill-head">
          <label for="bill">Bill</label>
          <div class="input-field">
            <img src="images/icon-dollar.svg" alt="" />
            <input type="number" id="bill" placeholder="0" />
          </div>
        </div>
        <div class="tip">
          <h4>Select Tip %</h4>
          <div class="tip-percentage-box">
            <button class="tip-box">5%</button>
            <button class="tip-box">10%</button>
            <button class="tip-box">15%</button>
            <button class="tip-box">25%</button>
            <button class="tip-box">50%</button>
            <input type="number" placeholder="Custom" id="custom" />
          </div>
        </div>
        <div class="NO-of-people">
          <label for="amount-people">Number of People</label>
          <div class="input-field">
            <img src="images/icon-person.svg" alt="" />
            <input type="number" id="amount-people" placeholder="0" />
          </div>
        </div>
      </div>
      <!-- </section> -->
      <div class="tips-page">
        <div class="tip-amount">
          <h5>Tip Amount</h5>
          <span>/ person</span> <span id="tip-amount">0.00</span>
        </div>
        <div class="Total">
          <h5>Total</h5>
          <span>/ person</span> <span id="total-amount">0.00</span>
        </div>
        <button id="reset">RESET</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
